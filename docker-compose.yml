services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      # 仅允许宿主机调试；后端容器仍经由 mongodb:27017 访问数据库。
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # 容器内监听端口与宿主机映射端口保持一致，便于直接调试 API。
      PORT: ${SERVER_PORT:-5000}
    ports:
      - "${SERVER_PORT:-5000}:${SERVER_PORT:-5000}"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:${SERVER_PORT:-5000}/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  client:
    build:
      context: ./client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-8080}:80"
    environment:
      # Nginx 模板在容器启动时据此生成后端代理地址。
      SERVER_PORT: ${SERVER_PORT:-5000}
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongodb_data:
